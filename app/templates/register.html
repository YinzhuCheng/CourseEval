{% extends "base.html" %}

{% block title %}Register - Notebook Runner MVP{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Create an account</h1>
        <p class="text-muted">Register to upload notebooks and track execution jobs.</p>
        <form method="post" action="/register" class="row g-3">
          <div class="col-12">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" required maxlength="50" />
          </div>
          <div class="col-12">
            <label class="form-label">Email</label>
            <input class="form-control" name="email" type="email" required maxlength="255" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Password</label>
            <input class="form-control" name="password" type="password" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Confirm password</label>
            <input class="form-control" name="confirm_password" type="password" required />
          </div>
          <div class="col-12 d-grid">
            <button class="btn btn-primary" type="submit">Register</button>
          </div>
        </form>
        <p class="mt-3 mb-0 small">
          Already have an account? <a href="/login">Sign in</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}{{ t("password.reset.title") }} - {{ t("site.title") }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5 col-xl-4">
    <div class="card auth-card">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">{{ t("password.reset.title") }}</h1>
        <p class="text-muted">{{ t("password.reset.subtitle") }}</p>
        <form method="post" action="/reset-password" class="row g-3">
          <input type="hidden" name="token" value="{{ reset_token }}" />
          <div class="col-12">
            <label class="form-label">{{ t("register.password") }}</label>
            <input class="form-control" name="password" type="password" required autocomplete="new-password" />
          </div>
          <div class="col-12">
            <label class="form-label">{{ t("register.confirm_password") }}</label>
            <input class="form-control" name="confirm_password" type="password" required autocomplete="new-password" />
          </div>
          <div class="col-12 d-grid">
            <button class="btn btn-primary" type="submit">{{ t("password.reset.submit") }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

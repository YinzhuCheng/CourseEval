{% extends "base.html" %}

{% block title %}{{ t("password.forgot.title") }} - {{ t("site.title") }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5 col-xl-4">
    <div class="card auth-card">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">{{ t("password.forgot.title") }}</h1>
        <p class="text-muted">{{ t("password.forgot.subtitle") }}</p>
        <form method="post" action="/forgot-password" class="row g-3">
          <div class="col-12">
            <label class="form-label">{{ t("register.email") }}</label>
            <input class="form-control" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="col-12 d-grid">
            <button class="btn btn-primary" type="submit">{{ t("password.forgot.submit") }}</button>
          </div>
        </form>
        <p class="mt-3 mb-0 small">
          <a href="/login">{{ t("register.pending.back_to_login") }}</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

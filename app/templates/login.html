{% extends "base.html" %}

{% block title %}{{ t("nav.login") }} - {{ t("site.title") }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">{{ t("login.title") }}</h1>
        <p class="text-muted">{{ t("login.subtitle") }}</p>
        <form method="post" action="/login" class="row g-3">
          <div class="col-12">
            <label class="form-label">{{ t("login.login") }}</label>
            <input class="form-control" name="login" required autocomplete="username" />
          </div>
          <div class="col-12">
            <label class="form-label">{{ t("login.password") }}</label>
            <input class="form-control" name="password" type="password" required autocomplete="current-password" />
          </div>
          <div class="col-12 d-grid">
            <button class="btn btn-primary" type="submit">{{ t("login.submit") }}</button>
          </div>
        </form>
        <p class="mt-3 mb-0 small">
          {{ t("login.need_account") }} <a href="/register">{{ t("login.register_here") }}</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Login - Notebook Runner MVP{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Sign in</h1>
        <p class="text-muted">Use your username or email to access your notebook jobs.</p>
        <form method="post" action="/login" class="row g-3">
          <div class="col-12">
            <label class="form-label">Username or email</label>
            <input class="form-control" name="login" required />
          </div>
          <div class="col-12">
            <label class="form-label">Password</label>
            <input class="form-control" name="password" type="password" required />
          </div>
          <div class="col-12 d-grid">
            <button class="btn btn-primary" type="submit">Login</button>
          </div>
        </form>
        <p class="mt-3 mb-0 small">
          Need an account? <a href="/register">Register here</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
